apiVersion: v1
kind: Namespace
metadata:
  name: dj-agent
  labels:
    name: dj-agent
    app.kubernetes.io/name: dj-agent
    app.kubernetes.io/part-of: dj-agent-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dj-agent-config
  namespace: dj-agent
  labels:
    app.kubernetes.io/name: dj-agent-backend
    app.kubernetes.io/component: configuration
data:
  # Application configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_V1_STR: "/api/v1"
  
  # Database configuration (non-sensitive)
  POSTGRES_DB: "dj_agent"
  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"
  
  # Redis configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"