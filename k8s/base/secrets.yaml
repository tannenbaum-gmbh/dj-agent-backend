  name: dj-agent-secrets
  namespace: dj-agent
  labels:
    app.kubernetes.io/name: dj-agent-backend
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded secrets (these should be injected by CI/CD or external secret management)
  POSTGRES_USER: ZGpfYWdlbnQ=  # dj_agent
  POSTGRES_PASSWORD: cGFzc3dvcmQ=  # password (change in production!)
  SECRET_KEY: c3VwZXJfc2VjcmV0X2tleV9jaGFuZ2VfaW5fcHJvZHVjdGlvbg==  # super_secret_key_change_in_production
