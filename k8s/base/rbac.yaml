apiVersion: v1
kind: ServiceAccount
metadata:
  name: dj-agent-backend
  namespace: dj-agent
  labels:
    app.kubernetes.io/name: dj-agent-backend
    app.kubernetes.io/component: serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dj-agent-backend
  namespace: dj-agent
  labels:
    app.kubernetes.io/name: dj-agent-backend
    app.kubernetes.io/component: rbac
rules:
# Minimal permissions for the application
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dj-agent-backend
  namespace: dj-agent
  labels:
    app.kubernetes.io/name: dj-agent-backend
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: dj-agent-backend
  namespace: dj-agent
roleRef:
  kind: Role
  name: dj-agent-backend
  apiGroup: rbac.authorization.k8s.io