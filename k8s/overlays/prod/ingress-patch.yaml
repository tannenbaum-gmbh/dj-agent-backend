apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dj-agent-backend-ingress
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-burst: "50"
spec:
  rules:
  - host: api.dj-agent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dj-agent-backend
            port:
              number: 80