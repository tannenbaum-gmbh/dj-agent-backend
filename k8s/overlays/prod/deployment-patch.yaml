apiVersion: apps/v1
kind: Deployment
metadata:
  name: dj-agent-backend
spec:
  replicas: 5
  template:
    spec:
      containers:
      - name: dj-agent-backend
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        - name: WORKERS
          value: "4"