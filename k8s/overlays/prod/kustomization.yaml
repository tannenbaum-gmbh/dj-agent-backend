apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dj-agent-backend-prod
  namespace: dj-agent

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: dj-agent-backend
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: dj-agent-backend-hpa
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: dj-agent-backend-ingress

images:
  - name: dj-agent-backend
    newTag: v1.0.0

replicas:
  - name: dj-agent-backend
    count: 5

labels:
  - pairs:
      environment: production