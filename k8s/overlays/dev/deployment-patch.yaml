apiVersion: apps/v1
kind: Deployment
metadata:
  name: dj-agent-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: dj-agent-backend
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"