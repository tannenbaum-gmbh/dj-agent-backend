apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dj-agent-backend-dev

namespace: dj-agent-dev

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: dj-agent-backend
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: dj-agent-config

images:
  - name: dj-agent-backend
    newTag: dev

replicas:
  - name: dj-agent-backend
    count: 1

labels:
  - pairs:
      environment: development